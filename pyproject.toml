[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamlit-permalink-pg"
dynamic = ["version"]
description = "Effortless permalinks in Streamlit apps. Synchronize Streamlit Widgets with URL Query Params."
readme = "README.md"
authors = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu"},
    { name = "Franciszek Piszcz", email = "franciszek.piszcz@rtbhouse.com"}
]
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.52",
    "packaging>=15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/streamlit_permalink"]

[tool.hatch.version]
path = "src/streamlit_permalink/__init__.py"

[project.urls]
repository = "https://github.com/pgarrett-scripps/streamlit-permalink"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "sphinx-autodoc-typehints>=1.12.0",
    "sphinx-autoapi>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "black>=25.1.0",
    "pylint>=3.3.7",
    "mypy>=1.16.1",
    "pre-commit>=4.2.0",
    "pandas>=2.2.3",
    "streamlit-option-menu>=0.4.0",
]

[tool.pylint]
fail-under = 9.0
max-line-length = 120
max-positional-arguments = 7
max-args = 7
disable = ["duplicate-code"]

[dependency-groups]
dev = [
    "ty>=0.0.7",
]
